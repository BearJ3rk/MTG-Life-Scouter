<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MTG Life Scouter V0.8</title><style>
:root{--ink:#f5f1e9;--muted:#a7aa9f;--line:#363930;--acid:#c9f05a}*{box-sizing:border-box}body{margin:0;background:#0e0f0d;color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{min-height:100dvh;padding:max(17px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#10110fe5,#0d0e0ce5),var(--table,none),radial-gradient(circle at 85% 0,#34411d,transparent 28%);background-size:cover;background-position:center}header{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:auto;padding:0 4px 14px}.brand{display:flex;gap:10px;align-items:center}.mark{width:36px;height:36px;border:1px solid #768b3d;border-radius:50%;display:grid;place-items:center;color:var(--acid);font:20px Georgia}.brand b{font:20px Georgia}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;text-transform:uppercase}.actions{display:flex;gap:7px}button,label{color:inherit}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:#191b17;font-size:18px}.grid{max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.player{position:relative;min-height:282px;border:1px solid color-mix(in srgb,var(--tone) 42%,#383a32);border-radius:22px;overflow:hidden;background:linear-gradient(rgba(14,15,13,var(--shade)),rgba(14,15,13,var(--shade))),var(--photo,none),linear-gradient(145deg,color-mix(in srgb,var(--tone) 20%,#191a17),#151613);background-size:cover;background-position:center;display:flex;flex-direction:column;box-shadow:0 15px 30px #0005}.head{z-index:1;padding:12px 12px 2px;display:flex;justify-content:space-between}.name{width:75%;border:0;outline:0;background:transparent;color:white;font-weight:800}.seat{font-size:10px;color:#bbb;border:1px solid #ffffff22;border-radius:20px;padding:4px 7px}.life-row{z-index:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:center;flex:1}.life-row button{height:100%;border:0;background:transparent;color:#ddd;font-size:28px}.life{font:clamp(62px,12vw,104px)/1 Georgia;text-align:center;text-shadow:0 4px 17px #000;letter-spacing:-.07em}.stats{z-index:1;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ffffff1a;margin:0 9px 9px}.stat{border:0;background:transparent;padding:12px 2px 5px;color:#bbb;font-size:11px}.stat+.stat{border-left:1px solid #ffffff1a}.stat b{color:white;font-size:15px}.toolbar{max-width:1000px;margin:9px auto 0;background:#181a16;border:1px solid var(--line);border-radius:17px;display:flex;justify-content:space-around;padding:7px;position:sticky;bottom:8px;z-index:5}.tool{border:0;background:transparent;color:#aaa;font-size:10px;padding:6px}.tool span{display:block;color:white;font-size:19px}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:end center;z-index:20}.modal.open{display:grid}.sheet{width:min(600px,100%);max-height:88dvh;overflow:auto;background:#1b1d19;border-radius:25px 25px 0 0;border:1px solid var(--line);padding:22px 17px max(25px,env(safe-area-inset-bottom))}.sheet h2{font:28px Georgia;margin:0 0 4px}.sheet p{margin:0 0 17px;color:var(--muted);font-size:13px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.option,.secondary{border:1px solid var(--line);background:#242620;border-radius:13px;padding:12px}.option.active{border-color:var(--acid);color:var(--acid)}.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0}.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--acid);color:#14170d;text-align:center;padding:14px;font-weight:900}.pick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#242620;padding:11px;border-radius:13px;margin:8px 0}.pick input{display:none}.pick label,.pick button{border:1px solid var(--line);background:#171915;border-radius:10px;padding:9px}.damage{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;align-items:center;background:#242620;padding:10px;border-radius:12px;margin:8px 0}.damage button{width:34px;height:34px;border:1px solid var(--line);background:#171915;border-radius:9px}@media(max-width:380px){.player{min-height:250px}.life{font-size:56px}.brand small{display:none}}
</style></head><body><main class="app" id="app"><section class="grid" id="grid"></section><nav class="toolbar"><button class="tool" onclick="openSetup()"><span>♟</span>Players</button><button class="tool" onclick="toggleStep()"><span>±</span><i id="stepText">Step 1</i></button><button class="tool" onclick="openDamage()"><span>⚔</span>Commander</button><button class="tool" onclick="openAppearance()"><span>⚙</span>Settings</button></nav></main>
<div class="modal" id="setup" onclick="if(event.target===this)closeAll()"><section class="sheet"><h2>Set the table</h2><p>Choose pod size and starting life.</p><div class="options" id="counts"></div><div class="row"><span>Starting life</span><div><button class="secondary" onclick="starting=Math.max(10,starting-10);setupView()">−</button> <b id="startText"></b> <button class="secondary" onclick="starting+=10;setupView()">+</button></div></div><button class="primary" onclick="newGame()">Start game</button></section></div>
<div class="modal" id="appearance" onclick="if(event.target===this)closeAll()"><section class="sheet"><h2>Settings</h2><p>Table-wide appearance and app options.</p><div class="pick"><span>Table background</span><label>Choose<input type="file" accept="image/*" onchange="pick(this,'table')"></label></div><div class="row"><span>Image darkness</span><input id="shade" type="range" min="20" max="90" oninput="look.shade=this.value/100;saveLook();render()"></div><button class="secondary update-setting" onclick="checkForUpdates()">↓ Check for updates</button><button class="primary" onclick="closeAll()">Done</button></section></div>
<div class="modal" id="playerAppearance" onclick="if(event.target===this)closeAll()"><section class="sheet"><h2 id="playerAppearanceTitle">Player tile</h2><p>These choices are saved on this device for future games.</p><div class="pick"><span>Tile color</span><input id="playerColorPicker" class="color-wheel" type="color" aria-label="Player tile color"></div><div class="pick"><span>Background image</span><span><label>Choose<input id="playerImagePicker" type="file" accept="image/*"></label> <button id="clearPlayerImage">Clear</button></span></div><button class="primary" onclick="closeAll()">Done</button></section></div>
<div class="modal" id="damageModal" onclick="if(event.target===this)closeAll()"><section class="sheet"><h2>Commander damage</h2><p id="damageTitle"></p><div id="damageRows"></div><button class="primary" onclick="closeAll()">Done</button></section></div>
<script>
const colors=['#8e6bed','#db704e','#45a993','#d8a73d','#4e84d7','#c95e9a'],names=['Riven','Kael','Mira','Orin','Veya','Dax'];let count=4,starting=40,step=1,selected=0;let players=read('al-game',[]),look=read('al-look',{table:'',photos:{},shade:.62});if(!players.length)fresh();function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem('al-game',JSON.stringify(players))}function saveLook(){localStorage.setItem('al-look',JSON.stringify(look))}function fresh(){players=Array.from({length:count},(_,i)=>({name:names[i],life:starting,poison:0,energy:0,damage:{}}));save()}function render(){app.style.setProperty('--table',look.table?`url(${look.table})`:'none');grid.innerHTML=players.map((p,i)=>`<article class="player" style="--tone:${colors[i]};--shade:${look.shade};--photo:${look.photos[i]?`url(${look.photos[i]})`:'none'}" onclick="selected=${i}"><div class="head"><input class="name" value="${p.name}" onchange="players[${i}].name=this.value;save()"><button class="seat" onclick="openPlayerAppearance(${i},event)">P${i+1}</button></div><div class="life-row"><button onclick="life(${i},-${step},event)">−</button><div class="life">${p.life}</div><button onclick="life(${i},${step},event)">+</button></div><div class="stats"><button class="stat" onclick="counter(${i},'poison',event)">✤ Poison <b>${p.poison}</b></button><button class="stat" onclick="counter(${i},'energy',event)">◆ Energy <b>${p.energy}</b></button></div></article>`).join('');save()}function life(i,n,e){e.stopPropagation();selected=i;players[i].life+=n;render()}function counter(i,k,e){e.stopPropagation();selected=i;players[i][k]=Math.max(0,players[i][k]+(e.shiftKey?-1:1));render()}function toggleStep(){step=step===1?5:1;stepText.textContent='Step '+step}function openSetup(){setup.classList.add('open');count=players.length;setupView()}function setupView(){counts.innerHTML=[2,3,4,6].map(n=>`<button class="option ${count===n?'active':''}" onclick="count=${n};setupView()">${n}</button>`).join('');startText.textContent=starting}function newGame(){fresh();render();closeAll()}function openAppearance(){appearance.classList.add('open');shade.value=look.shade*100}function pick(input,target){let f=input.files[0];if(!f)return;let reader=new FileReader;reader.onload=()=>{if(target==='table')look.table=reader.result;else look.photos[target]=reader.result;saveLook();render()};reader.readAsDataURL(f)}function openDamage(){damageModal.classList.add('open');let p=players[selected];damageTitle.textContent='Select the commander dealing damage';damageRows.innerHTML=players.map((o,j)=>j===selected?'':`<div class="damage"><span style="color:${colors[j]}">⚔ ${o.name}</span><button onclick="dmg(${j},-1)">−</button><b>${p.damage[j]||0}</b><button onclick="dmg(${j},1)">+</button></div>`).join('')}function dmg(j,n){let p=players[selected];p.damage[j]=Math.max(0,(p.damage[j]||0)+n);save();openDamage()}function resetGame(){if(confirm('Reset life, counters, and damage?')){players.forEach(p=>{p.life=starting;p.poison=0;p.energy=0;p.damage={}});render()}}function closeAll(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}render();
</script>
<style>
.player.opposite{transform:none}.commander-stat{line-height:1.2}.commander-summary{display:block;color:#fff;font-weight:800;font-size:10px;white-space:normal}
body{overflow:hidden}.app{height:100dvh;min-height:0;overflow:hidden;position:relative;padding:max(7px,env(safe-area-inset-top)) 8px max(7px,env(safe-area-inset-bottom))}header{height:42px;padding:0 4px}.mark{width:31px;height:31px}.icon{width:34px;height:34px}.grid{height:calc(100% - 42px);grid-template-rows:repeat(2,minmax(0,1fr));gap:44px 8px}.player{min-height:0;border-radius:18px}.head{padding:6px 9px 0}.life{font-size:clamp(44px,10vh,86px)}.stats{grid-template-columns:repeat(3,1fr);margin:0 7px 6px}.stat{padding:6px 1px 4px;font-size:9px}.stat b{display:block;font-size:12px}.toolbar{position:absolute;left:50%;top:calc(50% + 21px);bottom:auto;transform:translate(-50%,-50%);width:min(390px,70%);height:38px;margin:0;padding:2px 7px;border-radius:13px;box-shadow:0 5px 16px #000a}.toolbar .tool:nth-child(2),.toolbar .tool:nth-child(3){display:none}.tool{display:flex;align-items:center;gap:6px;padding:2px 12px}.tool span{display:inline;font-size:16px}.update-setting{width:100%;margin:2px 0 12px;font-weight:800}@media(max-height:600px){.brand small{display:none}.life{font-size:42px}.stat{padding:3px 1px}.grid{gap:38px}}
</style>
<script>
document.title='MTG Life Scouter V0.8';
function checkForUpdates(){window.AndroidUpdater?AndroidUpdater.checkForUpdates():alert('Updates are available in the Android app.')}
let lifeHoldTimer=null;
function beginLifeHold(i,d,e){e.stopPropagation();clearTimeout(lifeHoldTimer);lifeHoldTimer=setTimeout(()=>life(i,d*10,e),500)}
function endLifeHold(){clearTimeout(lifeHoldTimer);lifeHoldTimer=null}
function changeCounter(index,key,amount,e){e?.stopPropagation();selected=index;const before=snapshotPlayer(players[index]);players[index][key]=Math.max(0,players[index][key]+amount);rememberDefeat(players[index],before);save();render()}
let activeCounterPicker=null;
function showCounterPicker(button,index,key){activeCounterPicker={index,key};document.querySelectorAll('.counter-picker').forEach(picker=>picker.remove());const card=button.closest('.player'),picker=document.createElement('div');picker.className='counter-picker';picker.setAttribute('role','group');picker.setAttribute('aria-label',`Change ${key}`);picker.innerHTML=`<button aria-label="Decrease ${key}">−</button><span>${key}<b>${players[index][key]}</b></span><button aria-label="Increase ${key}">+</button>`;picker.children[0].onclick=e=>changeCounter(index,key,-1,e);picker.children[2].onclick=e=>changeCounter(index,key,1,e);card.appendChild(picker)}
function restoreCounterPicker(){if(!activeCounterPicker)return;const {index,key}=activeCounterPicker,card=document.querySelectorAll('.player')[index];if(!card||isDefeated(players[index])){activeCounterPicker=null;return}const stats=card.querySelectorAll('.stat:not(.commander-stat)'),button=key==='poison'?stats[0]:stats[1];if(button)showCounterPicker(button,index,key)}
function closeCounterPicker(){activeCounterPicker=null;document.querySelectorAll('.counter-picker').forEach(picker=>picker.remove())}
function addCounterGesture(button,index,key){let holdTimer=null,longPress=false;button.title='Tap to add 1; hold for − / + controls';button.setAttribute('aria-label',`${key}: tap to add one, hold for decrease and increase controls`);button.onpointerdown=e=>{e.stopPropagation();longPress=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{longPress=true;showCounterPicker(button,index,key)},500)};button.onpointerup=button.onpointercancel=button.onpointerleave=()=>{clearTimeout(holdTimer);holdTimer=null};button.onclick=e=>{e.stopPropagation();if(longPress){longPress=false;return}changeCounter(index,key,1,e)}}
function openDamageFor(i,e){e.stopPropagation();selected=i;openDamage()}
function commanderSummary(index){const damage=players[index].damage||{};const entries=Object.entries(damage).filter(([,amount])=>amount>0);return entries.length?entries.map(([attacker,amount])=>`${players[attacker]?.name||`P${Number(attacker)+1}`} ${amount}`).join(' · '):'None'}
function enhancePlayer(card,index){const lifeButtons=card.querySelectorAll('.life-row button');lifeButtons.forEach((button,n)=>{const direction=n===0?-1:1;button.onpointerdown=e=>beginLifeHold(index,direction,e);button.onpointerup=endLifeHold;button.onpointercancel=endLifeHold;button.onpointerleave=endLifeHold});const stats=card.querySelector('.stats');if(stats&&!stats.querySelector('.commander-stat')){const counterButtons=stats.querySelectorAll('.stat');addCounterGesture(counterButtons[0],index,'poison');addCounterGesture(counterButtons[1],index,'energy');const button=document.createElement('button');button.className='stat commander-stat';button.innerHTML=`⚔ Commander<span class="commander-summary">${commanderSummary(index)}</span>`;button.onclick=e=>openDamageFor(index,e);stats.insertBefore(button,stats.children[1])}}
const updateDamage=dmg;dmg=function(j,n){updateDamage(j,n);render();openDamage()}
function orientPlayers(){document.querySelectorAll('.player').forEach((card,index)=>{card.classList.remove('opposite');enhancePlayer(card,index)});restoreCounterPicker()}
new MutationObserver(orientPlayers).observe(grid,{childList:true});orientPlayers();
document.addEventListener('pointerdown',e=>{if(activeCounterPicker&&!e.target.closest('.counter-picker'))closeCounterPicker()},true);
</script>
<style>
.actions .icon:nth-child(2){display:none}.options{grid-template-columns:repeat(5,1fr)}.grid:has(.player:nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.pick .color-wheel{display:inline-block;width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:50%;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red);vertical-align:middle}.color-wheel::-webkit-color-swatch-wrapper{padding:3px}.color-wheel::-webkit-color-swatch{border:2px solid #fff;border-radius:50%}
</style>
<script>
look.colors=look.colors||{};
const resetTool=document.querySelector('.toolbar .tool:nth-child(3)');resetTool.style.display='flex';resetTool.innerHTML='<span>↻</span>Reset';resetTool.onclick=resetGame;
function playerColor(i){return look.colors[i]||colors[i%colors.length]}
function applyPlayerColors(){document.querySelectorAll('.player').forEach((card,i)=>card.style.setProperty('--tone',playerColor(i)))}
new MutationObserver(applyPlayerColors).observe(grid,{childList:true});applyPlayerColors();
function setPlayerColor(i,color){look.colors[i]=color;saveLook();render()}
function openPlayerAppearance(i,e){e?.stopPropagation();selected=i;playerAppearanceTitle.textContent=`P${i+1} · ${players[i].name}`;playerColorPicker.value=playerColor(i);playerColorPicker.oninput=()=>setPlayerColor(i,playerColorPicker.value);playerImagePicker.value='';playerImagePicker.onchange=()=>pick(playerImagePicker,i);clearPlayerImage.onclick=()=>{delete look.photos[i];saveLook();render()};playerAppearance.classList.add('open')}
const openDamageBase=openDamage;
openDamage=function(){openDamageBase();[...damageRows.querySelectorAll('.damage span')].forEach((label,row)=>{const playerIndexes=players.map((_,i)=>i).filter(i=>i!==selected);label.style.color=playerColor(playerIndexes[row])})}
setupView=function(){counts.innerHTML=[2,3,4,5,6].map(n=>`<button class="option ${count===n?'active':''}" onclick="count=${n};setupView()">${n}</button>`).join('');startText.textContent=starting}
function applyPodLayout(){document.querySelectorAll('.player').forEach(card=>card.classList.remove('opposite'))}
new MutationObserver(applyPodLayout).observe(grid,{childList:true});applyPodLayout()
</script>
<style>
.app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr) 44px minmax(0,1fr);gap:0 8px;padding-left:8px;padding-right:8px}
.grid{display:contents;height:auto}.player{grid-row:3}.player:nth-child(-n+2){grid-row:1}
.toolbar{position:static;grid-column:1/-1;grid-row:2;transform:none;width:calc(100% + 16px);max-width:none;height:44px;margin:0 0 0 -8px;padding:3px 10px;border-left:0;border-right:0;border-radius:0;box-shadow:0 -4px 14px #0008,0 4px 14px #0008}
.grid:has(.player:nth-child(2):last-child) .player{grid-column:1/-1}.grid:has(.player:nth-child(2):last-child) .player:nth-child(1){grid-row:1}.grid:has(.player:nth-child(2):last-child) .player:nth-child(2){grid-row:3}
.grid:has(.player:nth-child(3):last-child) .player:nth-child(1){grid-column:1/-1}.grid:has(.player:nth-child(3):last-child) .player:nth-child(n+2){grid-row:3}
.app:has(.player:nth-child(5)){grid-template-columns:repeat(3,minmax(0,1fr))}.grid:has(.player:nth-child(5)) .player{grid-row:3}.grid:has(.player:nth-child(5)) .player:nth-child(-n+3){grid-row:1}
.player.defeated{filter:grayscale(1);border-color:#777;background-color:#343434}
.player.defeated::before{content:'';position:absolute;inset:0;background:#202020cc;z-index:2;pointer-events:none}
.player.defeated::after{content:'☠\A Hold to undo defeat';white-space:pre;position:absolute;inset:0;display:grid;place-items:center;color:#eee;font-size:clamp(17px,4vh,30px);font-weight:800;text-align:center;text-shadow:0 4px 18px #000;z-index:3;pointer-events:none}
.player.defeated .head,.player.defeated .life-row,.player.defeated .stats{opacity:.3}
.seat{background:transparent;color:#bbb;cursor:pointer}.counter-picker{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:8;display:grid;grid-template-columns:44px auto 44px;align-items:center;gap:5px;padding:5px;background:#10120ff2;border:1px solid var(--acid);border-radius:13px;box-shadow:0 5px 18px #000}.counter-picker button{height:36px;border:1px solid #ffffff35;border-radius:9px;background:#292d24;color:#fff;font-size:24px;font-weight:800}.counter-picker span{min-width:48px;color:var(--acid);font-size:10px;font-weight:800;text-align:center;text-transform:capitalize}.counter-picker span b{display:block;color:#fff;font-size:13px}.player.defeated .counter-picker{display:none}
</style>
<script>
function isDefeated(player){return player.life<=0||player.poison>=10||Object.values(player.damage||{}).some(amount=>amount>=21)}
function snapshotPlayer(player){const snapshot={...player,damage:{...(player.damage||{})}};delete snapshot.defeatUndo;return snapshot}
function rememberDefeat(player,before){if(!isDefeated(before)&&isDefeated(player))player.defeatUndo=before;save()}
const lethalLifeBase=life;life=function(i,n,e){const before=snapshotPlayer(players[i]);lethalLifeBase(i,n,e);rememberDefeat(players[i],before);render()}
const lethalCounterBase=counter;counter=function(i,k,e){const before=snapshotPlayer(players[i]);lethalCounterBase(i,k,e);rememberDefeat(players[i],before);render()}
const lethalDamageBase=dmg;dmg=function(j,n){const before=snapshotPlayer(players[selected]);lethalDamageBase(j,n);rememberDefeat(players[selected],before);render();openDamage()}
function undoDefeat(index){const previous=players[index].defeatUndo;if(!previous)return;players[index]=snapshotPlayer(previous);save();render()}
function addDefeatUndoGesture(card,index){if(!isDefeated(players[index])||!players[index].defeatUndo)return;let timer=null;card.onpointerdown=e=>{if(e.target.closest('button,input'))return;clearTimeout(timer);timer=setTimeout(()=>undoDefeat(index),650)};card.onpointerup=card.onpointercancel=card.onpointerleave=()=>clearTimeout(timer)}
function applyDefeatStates(){document.querySelectorAll('.player').forEach((card,index)=>{card.classList.toggle('defeated',isDefeated(players[index]));addDefeatUndoGesture(card,index)})}
new MutationObserver(applyDefeatStates).observe(grid,{childList:true});applyDefeatStates()
</script></body></html>
