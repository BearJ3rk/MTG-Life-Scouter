plugins { id 'com.android.application' }

android {
    namespace 'com.arcaneledger.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arcaneledger.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ARCANE_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ARCANE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ARCANE_KEY_ALIAS')
                keyPassword System.getenv('ARCANE_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
