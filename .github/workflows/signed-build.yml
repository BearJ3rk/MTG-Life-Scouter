name: Signed Android Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCANE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcane-ledger.p12"
      - name: Build signed release APK
        env:
          ARCANE_KEYSTORE_PATH: ${{ runner.temp }}/arcane-ledger.p12
          ARCANE_KEYSTORE_PASSWORD: ${{ secrets.ARCANE_KEYSTORE_PASSWORD }}
          ARCANE_KEY_ALIAS: ${{ secrets.ARCANE_KEY_ALIAS }}
          ARCANE_KEY_PASSWORD: ${{ secrets.ARCANE_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneLedger-v0.1-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

